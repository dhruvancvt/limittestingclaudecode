version: "3.9"

services:
  # ------------------------------------------------------------------
  # FastAPI backend
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      # Mount home so Claude can work on real projects
      - "${DEFAULT_WORKING_DIR:-/home/user}:${DEFAULT_WORKING_DIR:-/home/user}"
      # Claude Code config / credentials
      - "${HOME}/.claude:/root/.claude:ro"
      - "${HOME}/.anthropic:/root/.anthropic:ro"
    ports:
      - "${PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - cc-remote

  # ------------------------------------------------------------------
  # Vite-built React frontend (served by nginx)
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: "http://localhost:${PORT:-8000}"
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cc-remote

networks:
  cc-remote:
    driver: bridge
